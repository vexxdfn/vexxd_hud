<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vexxd_hud</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="speedos.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="host" style="position:absolute;inset:0"><div id="stage"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="vx-carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#141518"/><rect width="4" height="8" fill="#1f2126"/><rect y="4" width="8" height="1" fill="rgba(255,255,255,.04)"/></pattern>
  <linearGradient id="vx-brushed-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454950"/><stop offset="1" stop-color="#23262b"/></linearGradient>
  <pattern id="vx-brushed" width="400" height="3" patternUnits="userSpaceOnUse"><rect width="400" height="3" fill="url(#vx-brushed-g)"/><rect width="400" height="1" fill="rgba(255,255,255,.05)"/></pattern>
  <linearGradient id="vx-wood-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d3c23"/><stop offset=".6" stop-color="#3b2414"/><stop offset="1" stop-color="#2a190d"/></linearGradient>
  <pattern id="vx-wood" width="11" height="400" patternUnits="userSpaceOnUse" patternTransform="rotate(10)"><rect width="11" height="400" fill="url(#vx-wood-g)"/><rect width="2" height="400" fill="rgba(0,0,0,.16)"/></pattern>
</defs></svg>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="speedos.js"></script>
<script src="menu.js"></script>
</body>
</html>
